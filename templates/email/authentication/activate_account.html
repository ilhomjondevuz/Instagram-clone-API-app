<div style="
    max-width: 600px;
    margin: 40px auto;
    padding: 40px 30px;
    background-color: #ffffff;
    border-radius: 16px;
    font-family: Arial, Helvetica, sans-serif;
    text-align: center;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
">

    <h1 style="
        margin: 0 0 15px;
        color: #262626;
        font-size: 28px;
    ">
        Welcome to Instagram Clone 👋
    </h1>

    <p style="
        margin: 0 0 25px;
        color: #666666;
        font-size: 16px;
        line-height: 1.6;
    ">
        Thank you for signing up!
        Use the verification code below to activate your account.
    </p>

    <div style="
        display: inline-block;
        padding: 18px 35px;
        margin: 10px 0 25px;
        background-color: #f2f2f2;
        border-radius: 12px;
        border: 1px solid #e0e0e0;
    ">
        <span style="
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 8px;
            color: #e1306c;
        ">
            {{ code }}
        </span>
    </div>

    <p style="
        margin: 0 0 10px;
        color: #777777;
        font-size: 14px;
    ">
        This code is required to activate your account.
    </p>

    <p style="
        margin: 0;
        color: #999999;
        font-size: 13px;
    ">
        If you didn't create this account, you can safely ignore this email.
    </p>

    <hr style="
        margin: 30px 0 20px;
        border: none;
        border-top: 1px solid #eeeeee;
    ">

    <p style="
        margin: 0;
        color: #aaaaaa;
        font-size: 12px;
    ">
        © 2026 Instagram Clone API
    </p>

</div>
